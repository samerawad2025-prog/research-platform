name: reader-quality-live
on:
  push:
    branches: ['codex/reader-quality-evaluation']
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/evaluate-reader-live.cjs
