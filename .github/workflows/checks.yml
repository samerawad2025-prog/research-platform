name: checks

# Every push and every pull request. These suites are the only thing
# standing between a plausible-looking change and a production
# regression, and until now they only ran when somebody remembered to
# run them. The timeout-budget regression in bbebf8b1 was mine, and a
# CI run would have caught it before it reached a deployment.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Node the project is developed on and the
          # version Vercel builds with.
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what
      # package-lock.json pins, so CI cannot quietly pass on a
      # different dependency tree than production runs.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # A build failure is the one check that proves the change can
        # actually deploy. Nothing below matters if this fails.
        run: npm run build
        env:
          # The build imports modules that read these. Placeholders are
          # enough to compile; nothing here reaches a real service, and
          # no real key belongs in a workflow file.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3199
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      # Each suite runs on its own step so a failure names itself in
      # the GitHub UI instead of hiding inside one combined log.
      #
      # test-docx-extraction.js is deliberately absent: it requires a
      # real .docx path as an argument and cannot run unattended.
      - name: Year normalization (BUG_HISTORY #18)
        run: node scripts/test-year-normalization.js

      - name: Language pairs (BUG_HISTORY #20, #25)
        run: node scripts/test-language-pairs.js

      - name: Field pairs (BUG_HISTORY #25)
        run: node scripts/test-field-pairs.js

      - name: Phone validation (BUG_HISTORY #22, #23)
        run: node scripts/test-phone-validation.js

      - name: Retry policy (BUG_HISTORY #29, #36, #37)
        run: node scripts/test-retry-policy.js

      - name: Timing and reclaim invariants (BUG_HISTORY #27, #28, #32)
        run: node scripts/test-timing.js

      - name: Researcher seeding (BUG_HISTORY #33)
        run: node scripts/test-researcher-seed.js

      - name: Extraction mode and manual entry (Phase 3 M1)
        run: node scripts/test-extraction-mode.js

      - name: Confirmation screen states (Phase 3 M1)
        run: node scripts/test-confirmation-view.js

      - name: Submission acceptance (Phase 3 M2A)
        run: node scripts/test-submission-acceptance.js

      - name: Submission form flow, agreement text and LinkedIn (Phase 3 M2B/M3)
        run: node scripts/test-submission-client.js

      - name: Admin review handlers (Phase 3 M4)
        run: node scripts/test-admin-handlers.js

      - name: Public research pages and files (Phase 3 M5)
        run: node scripts/test-public.js

      - name: Citations and activity counts (Phase 3 M6)
        run: node scripts/test-citations-activity.js

      - name: Source-grounded reader and article handlers
        run: node scripts/test-knowledge.js

      - name: Reviewed research directions and source eligibility
        run: node scripts/test-directions.js

      - name: Private publication status
        run: node scripts/test-publication-status.js

      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/sarp-browser" --no-package-lock --ignore-scripts playwright@1.58.2
          node "$RUNNER_TEMP/sarp-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Publication workflow browser checks (synthetic, hosted runner)
        run: NODE_PATH="$RUNNER_TEMP/sarp-browser/node_modules" node scripts/browser-phase4.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3199
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          ADMIN_REVIEW: enabled
          PUBLIC_RESEARCH: enabled
          EXTRACTION_MODE: manual

      - name: Reader, permission and article browser checks (synthetic only)
        run: NODE_PATH="$RUNNER_TEMP/sarp-browser/node_modules" node scripts/browser-knowledge.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3199
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: synthetic-server-only
          ADMIN_REVIEW: enabled
          PUBLIC_RESEARCH: enabled
          RESEARCH_KNOWLEDGE: enabled
          SUBMISSION_TOKEN_SECRET: synthetic-test-only-secret
          EXTRACTION_MODE: manual

      - name: Save synthetic interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          path: artifacts/ui/
          retention-days: 7

  knowledge-database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Optional permission and editorial publication, real Postgres
        run: node supabase/tests/knowledge-postgres.test.js
      - name: Upgrade existing schema without rewriting existing records
        run: KNOWLEDGE_UPGRADE=1 node supabase/tests/knowledge-postgres.test.js
